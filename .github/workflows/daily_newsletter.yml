name: Daily Baseball Newsletter

on:
  schedule:
    # UTC 00:00 = 한국 시간(KST) 오전 09:00
    - cron: '0 0 * * *'
  workflow_dispatch:

# Node.js 24 강제 적용으로 버전 경고 메시지 숨김 처리
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-newsletter:
    # ubuntu-latest 대신 특정 LTS 버전을 명시하여 마이그레이션 경고 방지
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v5

      - name: 2. 파이썬 3.12 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 필수 패키지 설치
        run: pip install -r requirements.txt

      - name: 4. 뉴스레터 발송 스크립트 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python baseball_newsletter.py
